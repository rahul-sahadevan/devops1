
name: Node.js CI

on:
  push:
    branches:
      - main
      - check_user
  pull_request:
    branches: [main]

jobs:
  backend-check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nodeuser
          POSTGRES_PASSWORD: nodeuser
          POSTGRES_DB: devops1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready
           -U nodeuser -d devops1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        run: npm ci
      
      - name: create databse tables
        run: PGPASSWORD=nodeuser psql -h localhost -U nodeuser -d devops1 -f schema.sql
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: nodeuser
          PGPASSWORD: nodeuser
          PGDATABASE: devops1

      - name: Run backend test
        run: npm test
        

  frontend-check:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  
  publish-image:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest

    needs:
      - backend-check
      - frontend-check

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  
